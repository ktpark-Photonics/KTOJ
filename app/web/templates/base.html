<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KTOJ{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #eef4f1; --surface: #ffffff; --surface-2: #eaf2ee;
      --ink: #17302b; --muted: #5c716b; --border: #dde7e2;
      --primary: #0f9d8f; --primary-press: #0c857a; --primary-ink: #ffffff;
      --primary-soft: #d6f3ee;
      --ok: #16a34a; --ok-soft: #dcfce7;
      --bad: #dc4a44; --bad-soft: #fbe2e1;
      --warn: #d98a09; --warn-soft: #fbeccb;
      --easy-bg: #dcfce7; --easy-ink: #15803d;
      --mid-bg: #d3eefb; --mid-ink: #0e6f96;
      --shadow-sm: 0 1px 2px rgba(16,40,36,.05);
      --shadow: 0 2px 4px rgba(16,40,36,.05), 0 8px 24px rgba(16,40,36,.06);
      --radius: 16px; --radius-sm: 10px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard",
        "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas,
        "D2Coding", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1614; --surface: #16211e; --surface-2: #1b2825;
        --ink: #e7efec; --muted: #9cb2ab; --border: #26362f;
        --primary: #2dd4bf; --primary-press: #14b8a6; --primary-ink: #04211d;
        --primary-soft: #123b35; --ok: #4ade80; --ok-soft: #123524;
        --bad: #f87171; --bad-soft: #3a1d1d; --warn: #fbbf24; --warn-soft: #3a2c10;
        --easy-bg: #123524; --easy-ink: #6ee7a8; --mid-bg: #0c2e3d; --mid-ink: #7dd3fc;
        --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
        --shadow: 0 2px 4px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e1614; --surface: #16211e; --surface-2: #1b2825;
      --ink: #e7efec; --muted: #9cb2ab; --border: #26362f;
      --primary: #2dd4bf; --primary-press: #14b8a6; --primary-ink: #04211d;
      --primary-soft: #123b35; --ok: #4ade80; --ok-soft: #123524;
      --bad: #f87171; --bad-soft: #3a1d1d; --warn: #fbbf24; --warn-soft: #3a2c10;
      --easy-bg: #123524; --easy-ink: #6ee7a8; --mid-bg: #0c2e3d; --mid-ink: #7dd3fc;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
      --shadow: 0 2px 4px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
    :root[data-theme="light"] {
      --bg: #eef4f1; --surface: #ffffff; --surface-2: #eaf2ee;
      --ink: #17302b; --muted: #5c716b; --border: #dde7e2;
      --primary: #0f9d8f; --primary-press: #0c857a; --primary-ink: #ffffff;
      --primary-soft: #d6f3ee; --ok: #16a34a; --ok-soft: #dcfce7;
      --bad: #dc4a44; --bad-soft: #fbe2e1; --warn: #d98a09; --warn-soft: #fbeccb;
      --easy-bg: #dcfce7; --easy-ink: #15803d; --mid-bg: #d3eefb; --mid-ink: #0e6f96;
      --shadow-sm: 0 1px 2px rgba(16,40,36,.05);
      --shadow: 0 2px 4px rgba(16,40,36,.05), 0 8px 24px rgba(16,40,36,.06);
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--font-sans); line-height: 1.6;
      -webkit-font-smoothing: antialiased; padding: 0 20px 60px; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .appbar { max-width: 860px; margin: 20px auto 22px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow-sm);
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800;
      font-size: 19px; letter-spacing: -.01em; color: var(--ink); }
    .brand:hover { text-decoration: none; }
    .brand .mark { width: 30px; height: 30px; border-radius: 9px;
      background: linear-gradient(135deg, var(--primary), #34c9b8);
      color: #fff; display: grid; place-items: center; font-size: 16px; }
    .appnav { display: flex; gap: 4px; align-items: center; }
    .appnav a { color: var(--muted); font-weight: 600; font-size: 14px;
      padding: 8px 14px; border-radius: 9px; }
    .appnav a:hover { color: var(--ink); background: var(--surface-2);
      text-decoration: none; }
    .appnav a.active { color: var(--primary); background: var(--primary-soft); }

    main { max-width: 860px; margin: 0 auto; }
    .page-head { margin: 4px 0 18px; }
    .page-head h1 { margin: 0; font-size: 26px; font-weight: 800;
      letter-spacing: -.02em; text-wrap: balance; }
    .page-head p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
    h2, h3, h4 { letter-spacing: -.01em; }
    .backlink { color: var(--muted); font-weight: 600; font-size: 14px; }
    .backlink:hover { color: var(--primary); }
    .muted { color: var(--muted); }

    .list { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; align-items: center; gap: 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 18px; box-shadow: var(--shadow-sm);
      color: inherit; transition: transform .12s ease, box-shadow .12s ease,
        border-color .12s ease; }
    .row:hover { transform: translateY(-2px); box-shadow: var(--shadow);
      border-color: var(--primary); text-decoration: none; }
    .num { font-family: var(--font-mono); color: var(--muted); font-size: 14px;
      width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
    .row .title { font-weight: 700; font-size: 16px; flex: 1; }
    .solved { color: var(--ok); font-size: 13px; font-weight: 700; }
    .go { color: var(--primary); font-weight: 700; font-size: 14px; }

    .badge { font-size: 12.5px; font-weight: 700; padding: 4px 11px;
      border-radius: 999px; white-space: nowrap; display: inline-flex;
      align-items: center; gap: 5px; }
    .b-easy { background: var(--easy-bg); color: var(--easy-ink); }
    .b-mid { background: var(--mid-bg); color: var(--mid-ink); }
    .b-meta { background: var(--surface-2); color: var(--muted); }

    .card { background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow-sm);
      padding: 24px; margin-bottom: 16px; }
    .detail-title { font-size: 24px; font-weight: 800; margin: 12px 0 10px;
      letter-spacing: -.02em; }
    .badgerow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .statement h1, .statement h2, .statement h3, .statement h4 {
      margin: 18px 0 6px; font-size: 16px; }
    .statement p { margin: 8px 0; }
    pre { background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 15px; overflow-x: auto;
      font-family: var(--font-mono); font-size: 13.5px; color: var(--ink); margin: 6px 0; }
    .io-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
    .io-grid .lbl { font-size: 13px; font-weight: 700; color: var(--muted);
      margin: 10px 0 2px; }

    .hint { display: flex; align-items: center; gap: 8px; font-size: 14px;
      color: var(--mid-ink); background: var(--mid-bg); border-radius: 10px;
      padding: 9px 13px; margin: 4px 0 10px; font-weight: 600; }
    .hint-fail { color: var(--warn); background: var(--warn-soft);
      align-items: flex-start; margin: 10px 0; line-height: 1.5; }
    .editor { background: #0d1b17; border-radius: var(--radius-sm);
      border: 1px solid var(--border); overflow: hidden; margin: 6px 0; }
    .editor .bar { display: flex; align-items: center; gap: 7px;
      padding: 9px 13px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .editor .dot { width: 11px; height: 11px; border-radius: 50%; }
    .editor .fname { margin-left: 8px; color: #9fb4ad; font-size: 12.5px;
      font-family: var(--font-mono); }
    .editor textarea, .editor pre.code { width: 100%; background: transparent;
      color: #e6efec; border: none; margin: 0; padding: 15px;
      font-family: var(--font-mono); font-size: 14px; line-height: 1.7;
      resize: vertical; display: block; }
    .editor textarea:focus { outline: none; }
    .actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
    .btn { font-family: var(--font-sans); font-weight: 700; font-size: 15px;
      cursor: pointer; border: none; border-radius: 11px; padding: 12px 26px;
      background: var(--primary); color: var(--primary-ink); box-shadow: var(--shadow-sm); }
    .btn:hover { background: var(--primary-press); }
    .tip { color: var(--muted); font-size: 13px; }

    .verdict-card { display: flex; align-items: center; gap: 18px;
      border-radius: var(--radius); padding: 20px 22px; margin: 10px 0 14px; }
    .verdict-card.ok { background: var(--ok-soft); }
    .verdict-card.bad { background: var(--bad-soft); }
    .verdict-card.wait { background: var(--warn-soft); }
    .vicon { width: 50px; height: 50px; border-radius: 14px; flex: none;
      display: grid; place-items: center; font-size: 25px; color: #fff; }
    .verdict-card.ok .vicon { background: var(--ok); }
    .verdict-card.bad .vicon { background: var(--bad); }
    .verdict-card.wait .vicon { background: var(--warn); }
    .vtext .big { font-size: 21px; font-weight: 800; }
    .verdict-card.ok .vtext .big { color: var(--ok); }
    .verdict-card.bad .vtext .big { color: var(--bad); }
    .verdict-card.wait .vtext .big { color: var(--warn); }
    .vtext .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .metrics { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .metric { background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 16px; }
    .metric .k { color: var(--muted); font-size: 12px; font-weight: 600; }
    .metric .v { font-size: 18px; font-weight: 800; font-family: var(--font-mono);
      font-variant-numeric: tabular-nums; }

    .vpill { font-family: var(--font-mono); font-weight: 800; font-size: 12.5px;
      padding: 4px 10px; border-radius: 8px; white-space: nowrap; }
    .vp-ok { background: var(--ok-soft); color: var(--ok); }
    .vp-bad { background: var(--bad-soft); color: var(--bad); }
    .vp-wait { background: var(--warn-soft); color: var(--warn); }
    .htime { font-family: var(--font-mono); color: var(--muted); font-size: 13px;
      text-align: right; font-variant-numeric: tabular-nums; }
    .hwhen { color: var(--muted); font-size: 13px; }

    .empty { text-align: center; padding: 54px 20px; color: var(--muted); }
    .empty .em { font-size: 44px; }
    .empty h2 { color: var(--ink); margin: 12px 0 4px; }
    .empty .btn { display: inline-block; margin-top: 18px; }
    .empty .btn:hover { text-decoration: none; }
  </style>
</head>
<body>
  <header class="appbar">
    <a class="brand" href="/"><span class="mark">▹</span> KTOJ</a>
    <nav class="appnav">
      <a href="/" class="{{ 'active' if active_tab == 'problems' }}">문제</a>
      <a href="/solve" class="{{ 'active' if active_tab == 'solve' }}">풀이</a>
      <a href="/submissions" class="{{ 'active' if active_tab == 'history' }}">내 제출 이력</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>

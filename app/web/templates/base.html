<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KTOJ{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --surface-2: #1c2330;
      --border: #30363d; --fg: #c9d1d9; --muted: #8b949e;
      --accent: #58d6d0; --link: #58a6ff;
      --ok: #3fb950; --bad: #f85149; --pending: #d29922;
      --mono: ui-monospace, SFMono-Regular, "Consolas", "D2Coding", monospace;
      --sans: system-ui, "Segoe UI", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: var(--sans); line-height: 1.65;
      margin: 0; padding: 0 1rem 4rem;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .nav {
      max-width: 900px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.9rem 0; border-bottom: 1px solid var(--border);
    }
    .nav .logo {
      font-family: var(--mono); font-weight: 700; font-size: 1.15rem;
      color: var(--accent); letter-spacing: 0.5px;
    }
    .nav .logo:hover { text-decoration: none; opacity: 0.85; }
    .nav nav a { font-family: var(--mono); color: var(--muted); margin-left: 1rem; }
    .nav nav a:hover { color: var(--fg); text-decoration: none; }

    main { max-width: 900px; margin: 1.5rem auto 0; }
    h1, h2, h3, h4 { font-family: var(--mono); color: #f0f6fc; line-height: 1.3; }
    h2 { border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
    .back { color: var(--muted); font-family: var(--mono); font-size: 0.9rem; }

    table { border-collapse: collapse; width: 100%; background: var(--surface);
            border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    th, td { padding: 0.6rem 0.9rem; text-align: left;
             border-bottom: 1px solid var(--border); }
    th { font-family: var(--mono); color: var(--muted); font-size: 0.8rem;
         text-transform: uppercase; letter-spacing: 0.5px; background: var(--surface-2); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface-2); }
    td.num { font-family: var(--mono); color: var(--muted); width: 3rem; }

    pre { background: #010409; border: 1px solid var(--border); border-radius: 6px;
          padding: 0.8rem 1rem; overflow-x: auto; font-family: var(--mono);
          font-size: 0.9rem; color: #e6edf3; }
    code { font-family: var(--mono); }
    .statement { background: var(--surface); border: 1px solid var(--border);
                 border-radius: 8px; padding: 0.2rem 1.2rem 1rem; margin: 1rem 0; }
    .statement :is(h1,h2,h3,h4) { border: none; }

    textarea {
      width: 100%; background: #010409; color: #e6edf3; border: 1px solid var(--border);
      border-radius: 6px; padding: 0.8rem 1rem; font-family: var(--mono);
      font-size: 0.92rem; line-height: 1.5; resize: vertical;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    button {
      font-family: var(--mono); font-weight: 700; cursor: pointer;
      background: var(--accent); color: #06231f; border: none;
      border-radius: 6px; padding: 0.55rem 1.4rem; font-size: 0.95rem;
    }
    button:hover { filter: brightness(1.08); }

    .badges { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center;
              margin: 0.6rem 0; }
    .badge {
      font-family: var(--mono); font-size: 0.75rem; font-weight: 700;
      padding: 0.15rem 0.55rem; border-radius: 999px; white-space: nowrap;
      border: 1px solid transparent;
    }
    .badge.meta { color: var(--muted); border-color: var(--border); background: var(--surface-2); }
    .diff-easy { color: var(--ok); border-color: rgba(63,185,80,0.4); background: rgba(63,185,80,0.12); }
    .diff-mid  { color: var(--accent); border-color: rgba(88,214,208,0.4); background: rgba(88,214,208,0.12); }

    .verdict {
      font-family: var(--mono); font-weight: 700; font-size: 1.5rem;
      padding: 0.2rem 0.7rem; border-radius: 8px; display: inline-block;
    }
    .verdict-AC { color: var(--ok); background: rgba(63,185,80,0.12); }
    .verdict-WA, .verdict-TLE, .verdict-MLE, .verdict-RE,
    .verdict-CE, .verdict-IE { color: var(--bad); background: rgba(248,81,73,0.12); }
    .verdict-PENDING, .verdict-JUDGING { color: var(--pending); background: rgba(210,153,34,0.12); }
    .meta-line { color: var(--muted); font-family: var(--mono); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header class="nav">
    <a class="logo" href="/">▓ KTOJ</a>
    <nav><a href="/">문제</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>

{% extends "base.html" %}
{% block title %}문제 목록 - KTOJ{% endblock %}
{% block content %}
<h2>문제 목록</h2>
<table>
  <tr><th>#</th><th>제목</th><th>난이도</th></tr>
  {% for p in problems %}
  <tr>
    <td>{{ p.id }}</td>
    <td><a href="/problems/{{ p.slug }}">{{ p.title }}</a></td>
    <td><span class="badge">{{ p.difficulty }}</span></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
